<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学员课时管理</title>
<style>
:root{--bg:#F7F4EF;--card:#FFFFFF;--ink:#23201C;--muted:#6E665C;--line:#E8E1D7;--line2:#DDD5CA;--accent:#5B3A8C;--accent-ink:#FFFFFF;--accent-soft:#EEE8F6;--warn:#8A4B00;--warn-soft:#FFF6E8;--warn-tag:#F6D9AE;--danger:#A61B1B;--danger-soft:#FBE9E7;--ok:#2F6B4F;--ok-soft:#E3F0E8;--num:"Inter",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{padding:20px 16px 4px;max-width:960px;margin:auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.date{font-size:13px;color:var(--muted)}
h1{font-size:22px;margin:0;font-weight:700}
.pill{font-size:12px;color:var(--muted);background:#EFEAE2;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.bad{color:var(--danger);background:var(--danger-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--num);font-size:22px;font-weight:700;line-height:1.3}
.kpi span{color:var(--muted);font-size:12px}
.kpi.warn{background:#FBEBD3}.kpi.warn b,.kpi.warn span{color:var(--warn)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
nav#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;min-height:48px}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:var(--accent);font-weight:700}
@media(min-width:760px){nav#tabs{position:sticky;top:0;bottom:auto;border:0;border-bottom:1px solid var(--line);background:var(--bg);display:flex;justify-content:center;gap:4px;padding:8px}
  nav#tabs button{flex-direction:row;gap:6px;font-size:15px;padding:8px 16px;border-radius:999px;min-height:40px}nav#tabs button svg{width:18px;height:18px}
  nav#tabs button.on{background:var(--accent);color:var(--accent-ink)}body{padding-bottom:24px}}
main{max-width:960px;margin:auto;padding:12px 16px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grow{flex:1;min-width:0}
button.b{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:0 14px;min-height:40px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button.d{color:var(--danger);border-color:#EBC3BE}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:15px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;min-height:44px;background:#fff;color:var(--ink)}
textarea{padding:10px 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;padding:0;min-height:42px;background:transparent;outline:none;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.stu{background:var(--card);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.stu.warn{background:var(--warn-soft)}
.stu.zero{background:var(--danger-soft)}
.stu .who{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.stu .name{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagw{font-size:11px;color:var(--warn);background:var(--warn-tag);padding:1px 6px;border-radius:6px;white-space:nowrap}
.tagz{font-size:11px;color:var(--danger);background:#F5CFCA;padding:1px 6px;border-radius:6px;white-space:nowrap}
.stu .bal{display:flex;align-items:baseline;gap:2px;min-width:48px;justify-content:flex-end}
.stu .bal b{font-family:var(--num);font-size:24px;font-weight:700}
.stu.warn .bal b{color:var(--warn)}.stu.zero .bal b{color:var(--danger)}
.stu .bal span{font-size:12px;color:var(--muted)}
.minus{width:44px;height:44px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-family:var(--num);font-size:16px;font-weight:700;cursor:pointer;flex:none}
.panel{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #EFE9E0;white-space:nowrap}
th{color:var(--muted);font-weight:500}
.tw{overflow-x:auto}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #EFE9E0}
.row:last-child{border:0}
.row.arch{opacity:.75}
.empty{color:var(--muted);text-align:center;padding:30px}
dialog{border:0;border-radius:20px;padding:0;max-width:460px;width:calc(100% - 32px);color:var(--ink)}
dialog::backdrop{background:rgba(35,32,28,.4)}
.dlg{padding:20px}
.dlg h3{margin:0 0 12px;font-size:18px}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg .foot button{min-height:44px}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet button{min-height:52px;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE9E0;margin:0!important;color:var(--ink)!important;font-size:15px!important}
.chk input{width:22px!important;min-height:22px;height:22px;accent-color:var(--accent)}
.list{max-height:50vh;overflow:auto}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:10px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars i.z{background:var(--line)}
.bars em{font-style:normal;font-family:var(--num);font-size:11px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
@media(max-width:420px){.cards3 .kpi b{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="hrow"><div><div class="date" id="today"></div><h1>学员课时</h1></div><span class="pill" id="syncInfo">数据保存在本机</span></div>
  <div class="kpis">
    <div class="kpi"><b id="kStu">0</b><span>学员</span></div>
    <div class="kpi"><b id="kBal">0</b><span>剩余课时</span></div>
    <div class="kpi warn"><b id="kWarn">0</b><span>待续费</span></div>
  </div>
</header>
<nav id="tabs"><button data-t="students" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>学员</button><button data-t="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>流水</button><button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>统计</button><button data-t="income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>收入</button><button data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>设置</button></nav>
<main id="view"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ========== 数据层 ========== */
const KEY = 'course-hours-v1';
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const TYPE = {consume:'上课消耗',recharge:'充值课时',adjust:'人工调整',undo:'撤销扣课',init:'初始录入'};
let db = load();

function blank(){return {students:[],transactions:[],settings:{warningThreshold:2,courses:[
  {id:'c1',weekday:1,name:'芭杆塑形跟练'},{id:'c2',weekday:2,name:'芭杆形体课'},
  {id:'c3',weekday:3,name:'舞韵瑜伽课'},{id:'c4',weekday:5,name:'芭杆塑形跟练'}]},createdAt:new Date().toISOString()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.students)return normalize(s)}catch(e){}return blank()}
function normalize(d){
  d.settings=d.settings||{};d.settings.courses=d.settings.courses||[];
  if(d.settings.warningThreshold==null)d.settings.warningThreshold=2;
  d.settings.courses.forEach(c=>{if(c.archived==null)c.archived=false;if(c.weekday===undefined)c.weekday=null});
  d.transactions=d.transactions||[];
  // 旧数据补上 courseId（按当时的课程名匹配），这样改名后仍能统计到同一门课
  const lab=c=>c.name+(c.weekday==null?'':'（'+WD[c.weekday]+'）');
  d.transactions.forEach(t=>{if(t.type==='consume'&&!t.courseId&&t.course){const c=d.settings.courses.find(c=>lab(c)===t.course);if(c)t.courseId=c.id}});
  // 旧的撤销记录补上 undoOf（对应同一学员之前最近一次未撤销的扣课）
  const used=new Set(d.transactions.filter(t=>t.undoOf).map(t=>t.undoOf));
  d.transactions.forEach((t,i)=>{if(t.type!=='undo'||t.undoOf)return;
    for(let j=i-1;j>=0;j--){const x=d.transactions[j];if(x.studentId===t.studentId&&x.type==='consume'&&!used.has(x.id)){t.undoOf=x.id;used.add(x.id);break}}});
  return d}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('保存失败：'+e.message)}}
function save(){saveLocal();render();Sync.schedule()}

/* ========== GitHub 私有仓库同步 ========== */
// 合并两份数据：流水按 id 取并集，学员按 id 取并集（已删除的除外），再由流水重算余额
function merge(a,b){
  const cleared=[a.clearedAt,b.clearedAt].filter(Boolean).sort().pop()||'';
  const deleted=new Set([...(a.deleted||[]),...(b.deleted||[])]);
  const tx=new Map();[...a.transactions,...b.transactions].forEach(t=>{if(t.time>=cleared&&!tx.has(t.id))tx.set(t.id,t)});
  const st=new Map();[...a.students,...b.students].forEach(s=>{if(deleted.has(s.id)||(s.createdAt||'')<cleared)return;
    const o=st.get(s.id);if(!o||(s.updatedAt||'')>(o.updatedAt||''))st.set(s.id,{...s})});
  const cs=new Map();[...a.settings.courses,...b.settings.courses].forEach(c=>{const o=cs.get(c.id);if(!o||(c.updatedAt||'')>(o.updatedAt||''))cs.set(c.id,{...c})});
  const sa=a.settings,sb=b.settings,newer=(sb.updatedAt||'')>(sa.updatedAt||'')?sb:sa;
  const out={students:[...st.values()].sort((x,y)=>(x.createdAt||'').localeCompare(y.createdAt||'')),
    transactions:[...tx.values()].sort((x,y)=>x.time.localeCompare(y.time)),
    settings:{warningThreshold:newer.warningThreshold,updatedAt:newer.updatedAt,courses:[...cs.values()]},
    deleted:[...deleted],clearedAt:cleared||undefined,createdAt:a.createdAt||b.createdAt};
  out.students.forEach(s=>{const ts=out.transactions.filter(t=>t.studentId===s.id);if(!ts.length)return;
    s.balance=0;s.purchasedTotal=0;s.consumedTotal=0;
    ts.forEach(t=>{s.balance+=t.delta;if(t.type==='init'||t.type==='recharge')s.purchasedTotal+=t.delta;
      if(t.type==='consume'){s.consumedTotal-=t.delta;s.lastCheckIn=t.time}if(t.type==='undo')s.consumedTotal-=t.delta})});
  return normalize(out)}
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const Sync={
  KEY:'course-hours-sync',timer:null,busy:false,again:false,
  cfg(){try{return JSON.parse(localStorage.getItem(this.KEY))||null}catch(e){return null}},
  setCfg(c){try{c?localStorage.setItem(this.KEY,JSON.stringify(c)):localStorage.removeItem(this.KEY)}catch(e){}},
  status(t,ok){const el=$('#syncInfo');if(el){el.textContent=t;el.title=t;el.className='pill'+(ok===true?' ok':ok===false?' bad':'')}},
  api(c,method,body){return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(c.path||'data.json')}`+(method==='GET'?'?t='+Date.now():''),
    {method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body),cache:'no-store'})},
  async pull(c){const r=await this.api(c,'GET');if(r.status===404)return{data:null,sha:null};
    if(!r.ok)throw new Error(r.status===401?'令牌无效或已过期':r.status===403?'令牌没有这个仓库的权限':'GitHub 返回 '+r.status);
    const j=await r.json();
    let text=j.content?b64d(j.content):'';
    if(!text&&j.download_url){const raw=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/git/blobs/${j.sha}`,{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github.raw'}});text=await raw.text()}
    return{data:text?normalize(JSON.parse(text)):null,sha:j.sha}},
  schedule(){if(!this.cfg())return;clearTimeout(this.timer);this.status('有改动，准备同步…');this.timer=setTimeout(()=>this.run(),1200)},
  async run(){const c=this.cfg();if(!c)return;if(this.busy){this.again=true;return}this.busy=true;this.status('正在同步…');
    try{for(let i=0;i<3;i++){const{data,sha}=await this.pull(c);
        const merged=data?merge(data,db):db;
        const before=JSON.stringify(db);db=merged;saveLocal();if(JSON.stringify(db)!==before)render();
        if(data&&JSON.stringify(merge(data,data))===JSON.stringify(merged)){break}
        const r=await this.api(c,'PUT',{message:'更新课时数据 '+fmtT(now()),content:b64e(JSON.stringify(merged,null,1)),...(sha?{sha}:{})});
        if(r.ok)break;if(r.status!==409&&r.status!==422)throw new Error('上传失败 '+r.status);}
      this.status('已同步 '+fmtT(now()).slice(11),true);
    }catch(e){this.status('同步失败：'+e.message+'（数据已保存在本机）',false)}
    this.busy=false;if(this.again){this.again=false;this.run()}}
};
window.addEventListener('focus',()=>Sync.cfg()&&Sync.run());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const stu=id=>db.students.find(s=>s.id===id);
const courseLabel=c=>c.name+(c.weekday==null?'':'（'+WD[c.weekday]+'）');
const activeCourses=()=>db.settings.courses.filter(c=>!c.archived);
const fmtT=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const p2=n=>String(n).padStart(2,'0');
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(Math.round(n*100)/100).toLocaleString('zh-CN');

function addTx(s,type,delta,{course='',courseId='',amount=0,note=''}={}){
  s.balance+=delta;
  if(type==='init'||type==='recharge')s.purchasedTotal=(s.purchasedTotal||0)+delta;
  if(type==='consume'){s.consumedTotal=(s.consumedTotal||0)-delta;s.lastCheckIn=now()}
  if(type==='undo')s.consumedTotal=(s.consumedTotal||0)-delta;
  const t={id:uid(),studentId:s.id,name:s.name,type,delta,remaining:s.balance,note,course,amount:+amount||0,time:now()};
  if(courseId)t.courseId=courseId;
  db.transactions.push(t);return t}

/* ========== 通用 UI ========== */
let tab='students',filters={stu:'all',type:'all',statStu:'',statYear:new Date().getFullYear()};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
function dialog(html,onOk){const d=$('#dlg');$('#dlgBody').innerHTML=html;d.showModal();
  const ok=$('#dlgBody [data-ok]');if(ok)ok.onclick=()=>{if(onOk()!==false)d.close()};
  $('#dlgBody [data-cancel]')?.addEventListener('click',()=>d.close())}
const foot=(ok='确定')=>`<div class="foot"><button class="b" data-cancel>取消</button><button class="b p" data-ok>${ok}</button></div>`;
const courseOptions=(sel)=>{const today=new Date().getDay();const cs=activeCourses();
  const def=sel||cs.find(c=>c.weekday===today)?.id||cs[0]?.id;
  return cs.map(c=>`<option value="${c.id}" ${c.id===def?'selected':''}>${esc(courseLabel(c))}</option>`).join('')||'<option value="">（没有可用课程）</option>'};

$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)goTab(b.dataset.t)};

function render(){
  const th=db.settings.warningThreshold,today=ymd(new Date());
  $('#kStu').textContent=db.students.length;
  $('#kBal').textContent=db.students.reduce((a,s)=>a+s.balance,0);
  {const d=new Date();$('#today').textContent=`${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`}
  $('#kWarn').textContent=db.students.filter(s=>s.balance<=th).length;
  ({students:vStudents,log:vLog,stats:vStats,income:vIncome,settings:vSettings})[tab]()}

/* ========== 学员 ========== */
function vStudents(){
  const th=db.settings.warningThreshold;
  const cnt={all:db.students.length,warn:db.students.filter(s=>s.balance<=th&&s.balance>0).length,zero:db.students.filter(s=>s.balance<=0).length};
  let list=[...db.students];
  if(filters.stu==='warn')list=list.filter(s=>s.balance<=th&&s.balance>0);
  if(filters.stu==='zero')list=list.filter(s=>s.balance<=0);
  list.sort((a,b)=>(b.balance<=0)-(a.balance<=0)||(b.balance<=th)-(a.balance<=th)||a.balance-b.balance);
  $('#view').innerHTML=`<div class="bar"><label class="search grow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E665C" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="搜索学员" aria-label="搜索学员"></label><button class="b p" id="batch">批量签到</button></div>
    <div class="chips">${[['all','全部'],['warn','快用完'],['zero','用完']].map(([k,v])=>`<button class="chip ${filters.stu===k?'on':''}" data-f="${k}">${v} ${cnt[k]}</button>`).join('')}

/* ========== 统计 ========== */
function statsFor(sid,year){
  const tx=db.transactions.filter(t=>t.studentId===sid&&new Date(t.time).getFullYear()===year);
  const months=Array.from({length:12},()=>({att:0,buy:0,amt:0,by:{}}));
  const undone=new Set(tx.filter(t=>t.undoOf).map(t=>t.undoOf));
  tx.forEach(t=>{const m=months[new Date(t.time).getMonth()];
    if(t.type==='consume'){m.att++;const k=t.course||'未注明课程';m.by[k]=(m.by[k]||0)+1}
    if(t.type==='undo'){m.att--;const o=db.transactions.find(x=>x.id===t.undoOf);const k=o?.course||'未注明课程';m.by[k]=(m.by[k]||0)-1}
    if(t.type==='init'||t.type==='recharge'){m.buy+=t.delta;m.amt+=t.amount||0}});
  months.forEach(m=>Object.keys(m.by).forEach(k=>{if(m.by[k]<=0)delete m.by[k]}));
  return months}
function vStats(){
  const years=[...new Set(db.transactions.map(t=>new Date(t.time).getFullYear()))].sort();if(!years.includes(filters.statYear))years.push(filters.statYear);
  if(!filters.statStu||!stu(filters.statStu))filters.statStu=db.students[0]?.id||'';
  const s=stu(filters.statStu);
  $('#view').innerHTML=`<div class="bar"><select id="ss">${db.students.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
  <select id="sy">${years.map(y=>`<option>${y}</option>`).join('')}</select><span class="grow"></span><button class="b" id="exS">导出本页（CSV）</button></div><div id="sv"></div>`;
  if(!s){$('#sv').innerHTML='<div class="empty">还没有学员</div>';return}
  $('#ss').value=s.id;$('#sy').value=filters.statYear;
  $('#ss').onchange=e=>{filters.statStu=e.target.value;render()};$('#sy').onchange=e=>{filters.statYear=+e.target.value;render()};
  const ms=statsFor(s.id,filters.statYear);
  const y={att:0,buy:0,amt:0,by:{}};ms.forEach(m=>{y.att+=m.att;y.buy+=m.buy;y.amt+=m.amt;for(const k in m.by)y.by[k]=(y.by[k]||0)+m.by[k]});
  const byStr=by=>Object.entries(by).map(([k,v])=>`${esc(k)} ${v}`).join('，')||'—';
  const mx=Math.max(1,...ms.map(m=>m.att));
  const rows=ms.map((m,i)=>({...m,i})).filter(m=>m.att||m.buy||m.amt).reverse();
  $('#sv').innerHTML=`<div class="cards3"><div class="kpi"><b>${y.att}</b><span>全年上课</span></div>
  <div class="kpi"><b>${y.buy}</b><span>全年充值</span></div><div class="kpi"><b>${money(y.amt)}</b><span>全年缴费</span></div></div>
  <div class="panel"><h3>每月上课节数</h3><div class="bars">${ms.map((m,i)=>`<div><em>${m.att||''}</em><i class="${m.att?'':'z'}" style="height:${Math.max(2,Math.round(m.att/mx*64))}px"></i>${i+1}</div>`).join('')}</div></div>
  <div class="panel"><h3>${esc(s.name)} · 按月明细 <span class="sub">当前剩余 ${s.balance} 节</span></h3>
  ${rows.length?`<div class="tw"><table><tr><th>月份</th><th>上课</th><th>充值</th><th>金额</th></tr>
  ${rows.map(m=>`<tr><td><b>${m.i+1}月</b></td><td>${m.att||'—'}</td><td>${m.buy||'—'}</td><td>${m.amt?money(m.amt):'—'}</td></tr>
  ${Object.keys(m.by).length?`<tr><td></td><td colspan="3" class="sub" style="white-space:normal;padding-top:0">${byStr(m.by)}</td></tr>`:''}`).join('')}
  <tr><th>合计</th><th>${y.att}</th><th>${y.buy}</th><th>${money(y.amt)}</th></tr></table></div>`:'<div class="empty">这一年没有记录</div>'}</div>
  <div class="panel"><h3>按课程（全年）</h3><div style="line-height:1.9">${byStr(y.by)}</div></div>`;
  $('#exS').onclick=()=>csv(`${s.name}_${filters.statYear}统计.csv`,[['月份','上课节数','充值课时','金额','按课程'],
    ...ms.map((m,i)=>[`${i+1}月`,m.att,m.buy,m.amt,Object.entries(m.by).map(([k,v])=>k+' '+v).join('；')]),['合计',y.att,y.buy,y.amt,'']])}

  $('#imJ').onclick=()=>$('#file').click();
  $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());
    if(!Array.isArray(d.students)||!Array.isArray(d.transactions))throw new Error('不是有效的备份文件');
    if(confirm(`备份里有 ${d.students.length} 位学员、${d.transactions.length} 条流水。导入会覆盖当前数据，继续？`)){db=normalize(d);save();toast('导入成功')}}
    catch(err){toast('导入失败：'+err.message)}e.target.value=''};
  $('#exL').onclick=()=>csv('学员名单.csv',[['姓名','剩余课时','已购课时','已上课时','最近上课','备注'],...db.students.map(s=>[s.name,s.balance,s.purchasedTotal,s.consumedTotal,s.lastCheckIn?ymd(s.lastCheckIn):'',s.note])]);
  $('#clr').onclick=()=>{if(confirm('确定清空全部数据？此操作无法恢复。')&&prompt('请输入「清空」确认')==='清空'){db=blank();db.settings.courses=cs;db.clearedAt=now();save();toast('已清空')}}}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(name,rows){download(name,'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n'),'text/csv')}

(function(){const m=location.hash.match(/sync=([\w-]+)/);if(!m)return;
  try{const j=JSON.parse(b64d(m[1].replace(/-/g,'+').replace(/_/g,'/')));Sync.setCfg({owner:j.o,repo:j.r,path:'data.json',token:j.t});
    history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>toast('这台设备已连上同步'),300)}catch(e){setTimeout(()=>toast('设备链接无效'),300)}})();
render();
if(Sync.cfg())Sync.run();
</script>
</body>
</html>
